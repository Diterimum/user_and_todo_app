name: Check Todo API

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/todo_db
      CLOUDFLARE_TUNNEL_TOKEN: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d db api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check root endpoint
        run: curl -f http://localhost:8000/

      - name: Check docs endpoint
        run: curl -f http://localhost:8000/docs

      - name: Show logs if success
        run: docker compose logs api

      - name: Stop containers
        if: always()
        run: docker compose down